name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on same branch
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: internapply
          POSTGRES_USER: internapply
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U internapply"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://internapply:test@127.0.0.1:5432/internapply
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff check (informational, warning-only)
        # ponytail: warning-only while 574 existing violations are triaged; gate is pytest/alembic/build
        run: ruff check . --exit-zero
        continue-on-error: true

      - name: Run tests
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee /tmp/pytest.log
          # pipefail ensures pytest exit code is propagated, not tail/tee's

      - name: Alembic check
        run: |
          set -o pipefail
          alembic -c backend/alembic.ini upgrade head 2>&1 | tee /tmp/alembic-upgrade.log
          alembic -c backend/alembic.ini check 2>&1 | tee /tmp/alembic-check.log
        env:
          DATABASE_URL: postgresql+asyncpg://internapply:test@127.0.0.1:5432/internapply

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Lint (warning-only)
        # ponytail: warning-only; Build is the gate. Remove continue-on-error when lint is clean.
        run: npm run lint 2>&1 | tee /tmp/lint.log
        continue-on-error: true

      - name: Typecheck (warning-only)
        # ponytail: warning-only; Build is the gate. Remove continue-on-error when typecheck is clean.
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee /tmp/typecheck.log
        continue-on-error: true

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
