name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on same branch
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: internapply
          POSTGRES_USER: internapply
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U internapply"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://internapply:test@127.0.0.1:5432/internapply
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff check
        run: |
          ruff check . 2>&1 | head -n 100
          ruff check . --exit-zero 2>&1 | tail -n 20
        continue-on-error: true

      - name: Run tests
        run: |
          pytest -q 2>&1 | tail -n 40

      - name: Alembic check
        run: |
          alembic -c backend/alembic.ini check 2>&1 | tail -n 20
          alembic -c backend/alembic.ini upgrade head 2>&1 | tail -n 20
        env:
          DATABASE_URL: postgresql+asyncpg://internapply:test@127.0.0.1:5432/internapply
        continue-on-error: true

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint 2>&1 | tail -n 30
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit 2>&1 | tail -n 30
        continue-on-error: true

      - name: Build
        run: npm run build 2>&1 | tail -n 40
