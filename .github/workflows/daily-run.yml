name: Daily InternApply Run

on:
  schedule:
    - cron: '17 3 * * *'    # 03:17 UTC = 08:47 IST — daily
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Maximum jobs to process"
        default: "10"
        required: false
      dry_run:
        description: "Dry run (no API calls)"
        type: boolean
        default: false

# Prevent concurrent runs from clobbering the same SQLite DB
concurrency:
  group: internapply-db
  cancel-in-progress: false

env:
  DB_PATH: data/internapply.db
  ARTIFACT_NAME: internapply-db
  PYTHON_VERSION: "3.12"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read    # download artifacts from prior runs
      contents: read   # checkout

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      # ── SQLite persistence: download DB from last successful run ──
      - name: Get last artifact run ID
        id: get-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api \
            "/repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1" \
            --jq '.artifacts[0].workflow_run.id // empty')
          if [[ -n "$run_id" ]]; then
            echo "artifact_run_id=$run_id" >> "$GITHUB_ENV"
            echo "Found DB artifact from run $run_id"
          else
            echo "No prior artifact found — starting fresh"
          fi

      - name: Download SQLite DB artifact
        if: env.artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./data/
          run-id: ${{ env.artifact_run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      # ── Playwright for auto-apply ──
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright
        run: |
          python -m playwright install chromium --with-deps 2>&1 | tail -3

      # ── Restore Internshala session (if configured) ──
      - name: Restore Internshala session
        if: ${{ secrets.INTERNSHALA_SESSION_JSON != '' }}
        run: |
          mkdir -p applications
          echo '${{ secrets.INTERNSHALA_SESSION_JSON }}' > applications/browser_session.json

      # ── Random start delay to avoid bot detection ──
      - name: Random start delay
        run: |
          DELAY=$(( RANDOM % 120 ))
          echo "Sleeping ${DELAY}s to randomize timing"
          sleep $DELAY

      # ── Run the pipeline ──
      - name: Run InternApply pipeline
        id: pipeline
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_TOKEN_PASSPHRASE: ${{ secrets.GMAIL_TOKEN_PASSPHRASE }}
          NAUKRI_APIFY_TOKEN: ${{ secrets.NAUKRI_APIFY_TOKEN }}
          DISPLAY: :99
        run: |
          # Xvfb for headed Playwright mode (needed for some sites)
          Xvfb :99 -screen 0 1280x1024x24 -ac 2>/dev/null &
          sleep 1

          MAX_JOBS="${{ github.event.inputs.max_jobs || '10' }}"
          DRY_RUN_FLAG="${{ github.event.inputs.dry_run && '--dry-run' || '' }}"
          internapply run --max-jobs "$MAX_JOBS" $DRY_RUN_FLAG 2>&1 | tee output.log

      # ── Validate DB before upload ──
      - name: Validate database
        if: always()
        run: |
          if [ -f "$DB_PATH" ]; then
            ROWS=$(sqlite3 "$DB_PATH" "SELECT COUNT(*) FROM job_listings;" 2>/dev/null || echo "0")
            echo "Database has $ROWS job listings"
          else
            echo "No database file found — skipping upload"
          fi

      # ── Upload updated DB for next run ──
      - name: Upload SQLite DB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DB_PATH }}
          if-no-files-found: warn
          retention-days: 90

      # ── Upload logs for debugging ──
      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internapply-logs
          path: |
            output.log
            applications/
            data/gmail_send_count.json
          if-no-files-found: ignore

      # ── Notify on failure ──
      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'InternApply pipeline failed',
              body: 'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            })
