name: Daily InternApply Run

on:
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC = 08:47 IST — daily
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Maximum jobs to process"
        default: "10"
        required: false
      dry_run:
        description: "Dry run (no API calls)"
        type: boolean
        default: false

# Prevent concurrent runs from clobbering the same DB
concurrency:
  group: internapply-db
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read

    env:
      DATABASE_URL: postgresql+asyncpg://internapply:test@127.0.0.1:5432/internapply
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: .

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: internapply
          POSTGRES_USER: internapply
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U internapply"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright
        run: |
          python -m playwright install chromium --with-deps 2>&1 | tail -n 3

      - name: Alembic upgrade
        run: |
          alembic -c backend/alembic.ini upgrade head 2>&1 | tail -n 20

      - name: Probe boards dry run
        run: |
          python scripts/probe_boards.py --limit 20 2>&1 | tail -n 20
        continue-on-error: true

      - name: Restore Internshala session
        run: |
          if [ -n "${{ secrets.INTERNSHALA_SESSION_JSON }}" ]; then
            mkdir -p applications
            echo '${{ secrets.INTERNSHALA_SESSION_JSON }}' > applications/browser_session.json
          else
            echo "No Internshala session secret — skipping"
          fi

      - name: Random start delay
        run: |
          DELAY=$(( RANDOM % 120 ))
          echo "Sleeping ${DELAY}s to randomize timing"
          sleep $DELAY

      - name: Run InternApply pipeline
        id: pipeline
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_TOKEN_PASSPHRASE: ${{ secrets.GMAIL_TOKEN_PASSPHRASE }}
          NAUKRI_APIFY_TOKEN: ${{ secrets.NAUKRI_APIFY_TOKEN }}
          DISPLAY: :99
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -ac 2>/dev/null &
          sleep 1
          MAX_JOBS="${{ github.event.inputs.max_jobs || '10' }}"
          DRY_RUN_FLAG="${{ github.event.inputs.dry_run && '--dry-run' || '' }}"
          internapply run --max-jobs "$MAX_JOBS" $DRY_RUN_FLAG 2>&1 | tee output.log

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internapply-logs
          path: |
            output.log
            applications/
            data/gmail_send_count.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'InternApply pipeline failed',
              body: 'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            })
