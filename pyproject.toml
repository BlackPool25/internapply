[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "internapply"
version = "0.1.0"
description = "Automated internship application system — discovers, tailors, and applies to paid backend internships"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "asgi-correlation-id>=2.0.0",
    "prometheus-fastapi-instrumentator>=6.0.0",
    "arq>=0.26.3",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "cryptography>=41.0.0",
    "openai>=1.0.0",
    "playwright>=1.40.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "python-docx>=1.1.0",
    "python-jobspy>=1.1.82",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
internapply = "internapply.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["internapply*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
