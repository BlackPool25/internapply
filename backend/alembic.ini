[alembic]
script_location = backend/alembic
prepend_sys_path = .

# The sqlalchemy.url is a placeholder — override via environment variable
# or by editing the config at migration time.  The actual DSN used at
# runtime comes from Settings (see backend/app/config.py).
sqlalchemy.url = postgresql+asyncpg://internapply:changeme@localhost:5432/internapply

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
